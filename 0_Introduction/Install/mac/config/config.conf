# Docker Installer 配置文件
# 注意：修改此文件后需要重新运行脚本

# 系统要求
REQUIRED_MEMORY_GB=4
REQUIRED_DISK_SPACE_GB=20

# Colima 配置
COLIMA_VM_NAME=default
# 内存大小，单位：MB
COLIMA_MEMORY=4096
# CPU核心数
COLIMA_CPU_COUNT=2
# 磁盘大小，单位：MB
COLIMA_DISK_SIZE=25000

# 网络配置
NETWORK_TIMEOUT=10

# 日志配置
DEBUG_MODE=false
QUIET_MODE=false
