# 基于自定义指标的 HPA 示例配置
# 适用于 prometheus-test-demo Spring Boot 应用
# 注意：使用自定义指标前需要先部署 Prometheus Adapter
#
# 前置条件：
# 1. prometheus-test-demo 应用已部署并暴露 Prometheus 指标
# 2. Prometheus Adapter 已配置并运行
# 3. 自定义指标 API 可用
#
# 触发扩容条件（满足任一条件即触发）：
# 1. CPU 平均利用率 ≥ 30%（demo 环境设置较低便于触发）
# 2. Pod 级别 HTTP 请求速率 ≥ 10 req/s（demo 环境设置较低便于触发）
#
# 触发缩容条件（所有条件都低于阈值时触发）：
# 1. CPU 平均利用率 < 30%
# 2. Pod 级别 HTTP 请求速率 < 10 req/s

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prometheus-test-demo-custom-hpa
  namespace: default  # 根据实际部署的命名空间调整
  labels:
    app: prometheus-test-demo
    hpa-type: custom-metrics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prometheus-test-demo
  minReplicas: 1
  maxReplicas: 5
  metrics:
  # 1. 资源指标：CPU 使用率
  # 作用：监控 Pod 的平均 CPU 利用率，防止 CPU 密集型任务导致性能下降
  # 触发：当所有 Pod 的平均 CPU 利用率超过 30% 时触发扩容（demo 环境设置较低便于触发）
  # 适用场景：计算密集型任务、数据处理、复杂业务逻辑等
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 30  # 30% CPU 利用率阈值（demo 环境设置较低便于触发）
  
  # 2. Pod 级别自定义指标：每个 Pod 的每秒 HTTP 请求数
  # 作用：监控每个 Pod 的请求处理能力，基于实际业务负载进行扩容
  # 触发：当单个 Pod 的平均请求速率超过 10 req/s 时触发扩容（demo 环境设置较低便于触发）
  # 适用场景：高并发 Web 应用、API 服务、微服务等
  # 依赖：需要应用暴露 http_server_requests_seconds_count 指标
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "10"  # 10 req/s 阈值（demo 环境设置较低便于触发）
  
  # 扩缩容行为配置（生产环境优化）
  behavior:
    scaleDown:
      # 缩容稳定窗口：5分钟
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60  # 每分钟最多缩容1个Pod
      - type: Percent
        value: 10
        periodSeconds: 60  # 每分钟最多缩容10%的Pod
      selectPolicy: Min  # 选择更保守的策略
    scaleUp:
      # 扩容稳定窗口：1分钟
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60  # 每分钟最多扩容2个Pod
      - type: Percent
        value: 50
        periodSeconds: 60  # 每分钟最多扩容50%的Pod
      selectPolicy: Max  # 选择更激进的策略