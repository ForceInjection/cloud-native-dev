# 基于 Namespace 级别自定义指标的 HPA 示例配置
# 使用 http_requests_per_second_by_app 指标进行自动扩缩容
# 适用于已部署的 prometheus-test-demo 应用
#
# 触发扩容条件（满足任一条件即触发）：
# 1. CPU 平均利用率 ≥ 20%（demo 环境设置更低便于触发）
# 2. 命名空间级别 HTTP 请求速率 ≥ 10 req/s（demo 环境设置更低便于触发）
#
# 触发缩容条件（所有条件都低于阈值时触发）：
# 1. CPU 平均利用率 < 20%
# 2. 命名空间级别 HTTP 请求速率 < 10 req/s

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prometheus-test-demo-namespace-hpa
  namespace: default  # 根据实际部署的命名空间调整
  labels:
    app: prometheus-test-demo
    hpa-type: namespace-metrics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prometheus-test-demo
  minReplicas: 1
  maxReplicas: 3
  metrics:
  # 1. 资源指标：CPU 使用率
  # 作用：监控 Pod 的平均 CPU 利用率，防止 CPU 密集型任务导致性能下降
  # 触发：当所有 Pod 的平均 CPU 利用率超过 20% 时触发扩容（demo 环境设置更低便于触发）
  # 适用场景：计算密集型任务、数据处理、复杂业务逻辑等
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 20  # 20% CPU 利用率阈值（demo 环境设置更低便于触发）
  
  # 2. Namespace 级别自定义指标：应用维度的每秒 HTTP 请求数
  # 作用：监控整个命名空间中应用的总请求速率，反映业务负载情况
  # 触发：当命名空间级别的请求速率超过 10 req/s 时触发扩容
  # 适用场景：高并发访问、流量突增、用户活跃度提升等
  # 使用 http_requests_per_second_by_app 指标
  - type: Object
    object:
      metric:
        name: http_requests_per_second_by_app
      describedObject:
        apiVersion: v1
        kind: Namespace
        name: default  # 根据实际部署的命名空间调整
      target:
        type: Value
        value: "10"  # 10 req/s 阈值（demo 环境设置较低便于触发）
  
  # 扩缩容行为配置（针对 demo 优化，响应更快）
  behavior:
    scaleDown:
      # 缩容稳定窗口：2分钟（demo 环境可以更快）
      stabilizationWindowSeconds: 120
      policies:
      - type: Pods
        value: 1
        periodSeconds: 30  # 更快的缩容检查间隔
      - type: Percent
        value: 50  # 更激进的缩容比例
        periodSeconds: 30
      selectPolicy: Max  # 选择更激进的策略
    scaleUp:
      # 扩容稳定窗口：30秒（demo 环境快速响应）
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 1  # 每次至少扩容1个Pod
        periodSeconds: 15  # 更快的扩容检查间隔
      - type: Percent
        value: 100  # 更激进的扩容比例
        periodSeconds: 15
      selectPolicy: Max