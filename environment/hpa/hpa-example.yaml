# 本地 HPA 示例配置
# 适用于 Kubernetes v1.23.17 本地环境

# 示例应用部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-hpa-demo
  namespace: default
  labels:
    app: nginx-hpa-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-hpa-demo
  template:
    metadata:
      labels:
        app: nginx-hpa-demo
    spec:
      containers:
      - name: nginx
        image: docker.m.daocloud.io/library/nginx:1.21
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
# 服务配置
apiVersion: v1
kind: Service
metadata:
  name: nginx-hpa-demo-service
  namespace: default
spec:
  selector:
    app: nginx-hpa-demo
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
---
# HPA 配置 - 本地环境优化
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa-demo
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-hpa-demo
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60