# green-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-green
  labels:
    app: python
    version: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: python
      version: green
  template:
    metadata:
      labels:
        app: python
        version: green
    spec:
      containers:
        - name: python
          image: python-server:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 500m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 100Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5